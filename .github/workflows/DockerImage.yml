name: CD - Build & Deploy Docker Image

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fis_2610_3517_g1-backend
            context: .
            is_backend: true
          - image: fis_2610_3517_g1-frontend
            context: ./medtrack-app
            is_backend: false

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push - Backend
        if: matrix.is_backend == true
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          build-args: |
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_FROM=${{ secrets.TWHILIO_FROM }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}

      - name: Build y push - Frontend
        if: matrix.is_backend == false
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

      - name: Verificar imágenes construidas
        run: docker images