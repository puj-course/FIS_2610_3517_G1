name: Build

on:
  push:
    branches:
      - main
      - develop
      - features-vanesa
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Tests and SonarQube
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017/medtrack_test
      SECRET_KEY: test-secret-key-for-pytest-medtrack

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pymongo python-dotenv

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest -v tests \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Verify coverage report
        run: |
          ls -la coverage.xml
          head -n 20 coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}