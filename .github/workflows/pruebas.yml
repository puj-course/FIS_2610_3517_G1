name: Ejecutar pruebas + Reporte

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html httpx

      - name: Ejecutar pruebas y generar reportes
        run: |
          PYTHONPATH=. pytest tests/ \
          --junitxml=report.xml \
          --html=report.html --self-contained-html

      - name: Subir reporte XML
        uses: actions/upload-artifact@v4
        with:
          name: reporte-xml
          path: report.xml

      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        with:
          name: reporte-html
          path: report.html

      - name: Enviar resultado a Telegram
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            MENSAJE="✅ MedTrack CI: Todas las pruebas pasaron correctamente."
          else
            MENSAJE="❌ MedTrack CI: Algunas pruebas fallaron."
          fi

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="$MENSAJE"