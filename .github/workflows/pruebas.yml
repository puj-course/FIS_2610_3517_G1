name: Ejecutar pruebas + Reporte

on:
  push:
    branches:
      - develop
      - main
      - feature/**
      - features/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: test-secret-key-for-pytest-medtrack

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html httpx

      - name: Ejecutar pruebas y generar reportes
        id: pruebas
        continue-on-error: true
        run: |
          PYTHONPATH=. pytest tests/ \
          --junitxml=report.xml \
          --html=report.html --self-contained-html

      - name: Subir reporte XML
        uses: actions/upload-artifact@v4
        with:
          name: reporte-xml
          path: report.xml

      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        with:
          name: reporte-html
          path: report.html

      - name: Enviar resultado a Telegram
        if: always()
        run: |
          STATUS="${{ steps.pruebas.outcome }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            MENSAJE="✅ MedTrack CI: pruebas exitosas.%0A📦 Repo: $REPO%0A🌿 Rama: $BRANCH%0A👤 Autor: $ACTOR%0A🔗 Reporte: $RUN_URL"
          else
            MENSAJE="❌ MedTrack CI: pruebas fallidas.%0A📦 Repo: $REPO%0A🌿 Rama: $BRANCH%0A👤 Autor: $ACTOR%0A🔗 Reporte: $RUN_URL"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MENSAJE"

      - name: Fallar pipeline si fallaron las pruebas
        if: steps.pruebas.outcome != 'success'
        run: exit 1