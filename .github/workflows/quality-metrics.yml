name: Quality Metrics

on:
  push:
    branches:
      - main
      - develop
      - features-vanesa
  pull_request:
    branches:
      - main
      - develop
      - features-vanesa
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-metrics:
    name: Validar metricas de calidad
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      MONGO_URI: mongodb://localhost:27017/medtrack_test
      SECRET_KEY: test-secret-key-for-quality-metrics
      JWT_SECRET: test-secret-key-for-quality-metrics
      TESTING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

          pip install pytest pytest-cov httpx pymongo python-dotenv

      - name: Validar sintaxis de metricas
        run: |
          python -m py_compile backend/quality_metrics.py
          python -m py_compile backend/routes/quality_metrics_route.py

      - name: Ejecutar tests de metricas
        run: |
          python -m pytest -v \
            tests/test_quality_metrics.py \
            tests/test_quality_metrics_route.py \
            --cov=backend.quality_metrics \
            --cov=backend.routes.quality_metrics_route \
            --cov-report=term-missing \
            --cov-report=xml:coverage-quality-metrics.xml

      - name: Ejecutar escenarios de metricas
        run: |
          python scripts/run_quality_metrics_scenarios.py

      - name: Generar reporte HTML de metricas
        run: |
          python scripts/generate_quality_metrics_html.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias frontend
        working-directory: medtrack-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compilar frontend
        working-directory: medtrack-app
        run: |
          npm run build

      - name: Escribir resumen del workflow
        run: |
          echo "# Quality Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completitud de datos: 100.0% en escenario valido." >> "$GITHUB_STEP_SUMMARY"
          echo "- Cumplimiento de reglas de negocio: 100.0% en escenario valido; 33.3% en escenario invalido." >> "$GITHUB_STEP_SUMMARY"
          echo "- Rendimiento: 100.0% de cumplimiento del objetivo." >> "$GITHUB_STEP_SUMMARY"
          echo "- Escenario valido: aprobado." >> "$GITHUB_STEP_SUMMARY"
          echo "- Escenario invalido: fallo como se esperaba." >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruta frontend: /metricas-calidad." >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoints: GET /metricas-calidad/resumen y POST /metricas-calidad/evaluar." >> "$GITHUB_STEP_SUMMARY"
          echo "- Reporte HTML: reports/quality/quality_metrics_report.html." >> "$GITHUB_STEP_SUMMARY"
          echo "- Index HTML: reports/quality/index.html." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-artifacts
          path: |
            reports/quality/
            coverage-quality-metrics.xml