name: Quality Metrics

on:
  push:
    branches:
      - main
      - develop
      - features-vanesa
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  quality-metrics:
    name: Validar metricas de calidad
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017/medtrack_test
      SECRET_KEY: test-secret-key-for-pytest-medtrack
      TESTING: "1"
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov

      - name: Validar sintaxis
        run: |
          python -m py_compile backend/quality_metrics.py backend/routes/quality_metrics_route.py

      - name: Ejecutar pruebas de metricas
        run: |
          PYTHONPATH=. python -m pytest -v \
            tests/test_quality_metrics.py \
            tests/test_quality_metrics_route.py \
            --cov=backend.quality_metrics \
            --cov=backend.routes.quality_metrics_route \
            --cov-report=term-missing \
            --cov-report=xml:coverage-quality-metrics.xml

      - name: Ejecutar escenarios versionados
        run: |
          PYTHONPATH=. python scripts/run_quality_metrics_scenarios.py

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: medtrack-app/package-lock.json

      - name: Build frontend MedTrack
        working-directory: medtrack-app
        run: |
          npm ci
          npm run build

      - name: Publicar artifacts de metricas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-metrics-artifacts
          path: |
            reports/quality/
            coverage-quality-metrics.xml

      - name: Escribir resumen
        if: always()
        run: |
          if [ -f reports/quality/quality_metrics_summary.md ]; then
            cat reports/quality/quality_metrics_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Quality Metrics" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No se genero reports/quality/quality_metrics_summary.md." >> "$GITHUB_STEP_SUMMARY"
          fi
