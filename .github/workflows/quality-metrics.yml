name: Quality Metrics

on:
  push:
    branches:
      - main
      - develop
      - features-vanesa

  pull_request:
    branches:
      - main
      - develop
      - features-vanesa

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality-metrics:
    name: Validar metricas de calidad
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      MONGO_URI: mongodb://localhost:27017/medtrack_test
      SECRET_KEY: test-secret-key-for-quality-metrics
      JWT_SECRET: test-secret-key-for-quality-metrics
      TESTING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

          pip install pytest pytest-cov httpx pymongo python-dotenv

      - name: Validar sintaxis de metricas
        run: |
          python -m py_compile backend/quality_metrics.py
          python -m py_compile backend/routes/quality_metrics_route.py

      - name: Ejecutar tests de metricas
        run: |
          python -m pytest -v \
            tests/test_quality_metrics.py \
            tests/test_quality_metrics_route.py \
            --cov=backend.quality_metrics \
            --cov=backend.routes.quality_metrics_route \
            --cov-report=term-missing \
            --cov-report=xml:coverage-quality-metrics.xml

      - name: Ejecutar escenarios de metricas
        run: |
          python scripts/run_quality_metrics_scenarios.py

      - name: Generar reporte HTML de metricas
        run: |
          if [ -f scripts/generate_quality_metrics_html.py ]; then
            python scripts/generate_quality_metrics_html.py
          else
            echo "No existe scripts/generate_quality_metrics_html.py, se omite reporte HTML."
          fi

      - name: Generar resumen Markdown para GitHub
        run: |
          python scripts/generate_quality_metrics_summary.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias frontend
        working-directory: medtrack-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compilar frontend
        working-directory: medtrack-app
        run: |
          npm run build

      - name: Publicar resumen en GitHub Actions
        run: |
          cat reports/quality/quality_metrics_pr_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar resultados en Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const summaryPath = 'reports/quality/quality_metrics_pr_summary.md';
            const summary = fs.readFileSync(summaryPath, 'utf8');

            const marker = '<!-- quality-metrics-summary -->';
            const body = `${marker}\n${summary}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.data.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload quality metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-artifacts
          path: |
            reports/quality/
            coverage-quality-metrics.xmlnano scripts/generate_quality_metrics_summary.py