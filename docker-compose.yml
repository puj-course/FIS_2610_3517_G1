version: '3.8'
services:
  frontend:
    build:
      context: ./medtrack-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      - TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      - TWILIO_FROM: ${{ secrets.TWHILIO_FROM }}
      - MONGO_URI: ${{ secrets.MONGO_URI }}
      - SECRET_KEY: ${{secrets.SECRET_KEY}}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge