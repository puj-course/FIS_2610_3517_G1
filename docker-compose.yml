version: '3.8'
services:
  frontend:
    build:
      context: ./medtrack-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI: ${{ secrets.MONGO_URI }}
      - SECRET_KEY: ${{secrets.SECRET_KEY}}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge