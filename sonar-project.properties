sonar.projectKey=puj-course_FIS_2610_3517_G1
sonar.organization=puj-course
sonar.host.url=https://sonarcloud.io

# Analizar solo backend
sonar.sources=backend
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8

# Excluir frontend completo y archivos generados
sonar.exclusions=frontend/**,**/__pycache__/**,**/.pytest_cache/**,.venv/**,backend/venv/**,**/database.db,**/*.db,coverage.xml,htmlcov/**,**/build-wrapper-dump.json

# Excluir de coverage lo que no debe contar
sonar.coverage.exclusions=tests/**,frontend/**,backend/seed.py,backend/main.py,backend/__init__.py,backend/**/__init__.py

# Excluir duplicación del frontend completo
sonar.cpd.exclusions=frontend/**